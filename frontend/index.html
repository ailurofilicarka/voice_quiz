<!DOCTYPE html>
<html lang="en" data-theme="dark">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Voice Quiz</title>

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />

        <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎙️</text></svg>" />

        <link rel="stylesheet" href="/static/style.css" />
    </head>

    <body>
        <div class="app">

            <!-- Masthead -->
            <div class="masthead">
                <div class="wordmark">Voice<span>·</span>Quiz</div>
                <button class="theme-btn" onclick="toggleTheme()" aria-label="Switch colour theme">
                    <svg id="theme-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                        <circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
                    </svg>
                    <span id="theme-label">Light</span>
                </button>
            </div>

            <!-- Setup screen -->
            <section class="panel screen" id="screen-setup">
                <h1 class="setup-intro">Answer out loud.</h1>

                <!-- Questions: slider with live readout -->
                <div class="setup-group">
                    <div class="setup-label">
                        <label for="cfg-count">Questions</label>
                        <span class="value" id="count-value">5</span>
                    </div>
                    <div class="range-row">
                        <span class="edge">3</span>
                        <input type="range" id="cfg-count" min="3" max="20" value="5" />
                        <span class="edge">20</span>
                    </div>
                </div>

                <!-- Host: selectable cards -->
                <div class="setup-group">
                    <div class="setup-label"><span>Host</span></div>
                    <div class="host-grid" id="host-grid" role="radiogroup" aria-label="Host personality">
                        <button type="button" class="host-card is-active" data-value="classic" role="radio" aria-checked="true">
                            <span class="emoji" aria-hidden="true">🎙️</span>
                            <span class="name">Classic TV host</span>
                            <span class="desc">Calm with a dramatic flair</span>
                        </button>
                        <button type="button" class="host-card" data-value="sarcastic" role="radio" aria-checked="false">
                            <span class="emoji" aria-hidden="true">😏</span>
                            <span class="name">Sarcastic host</span>
                            <span class="desc">Playfully merciless</span>
                        </button>
                        <button type="button" class="host-card" data-value="robot" role="radio" aria-checked="false">
                            <span class="emoji" aria-hidden="true">🤖</span>
                            <span class="name">AI robot</span>
                            <span class="desc">Analytical and dry</span>
                        </button>
                        <button type="button" class="host-card" data-value="villain" role="radio" aria-checked="false">
                            <span class="emoji" aria-hidden="true">😈</span>
                            <span class="name">Evil villain</span>
                            <span class="desc">Wants you to fail</span>
                        </button>
                        <button type="button" class="host-card" data-value="commentator" role="radio" aria-checked="false">
                            <span class="emoji" aria-hidden="true">📣</span>
                            <span class="name">Sports commentator</span>
                            <span class="desc">High energy, big stakes</span>
                        </button>
                        <button type="button" class="host-card" data-value="teacher" role="radio" aria-checked="false">
                            <span class="emoji" aria-hidden="true">🍎</span>
                            <span class="name">Friendly teacher</span>
                            <span class="desc">Kind and encouraging</span>
                        </button>
                    </div>
                </div>

                <!-- Category: pill chips -->
                <div class="setup-group">
                    <div class="setup-label"><span>Category</span></div>
                    <div class="chip-row" id="category-row" role="radiogroup" aria-label="Category">
                        <button type="button" class="chip is-active" data-value="general knowledge" role="radio" aria-checked="true">General knowledge</button>
                        <button type="button" class="chip" data-value="science and nature" role="radio" aria-checked="false">Science &amp; nature</button>
                        <button type="button" class="chip" data-value="history" role="radio" aria-checked="false">History</button>
                        <button type="button" class="chip" data-value="geography" role="radio" aria-checked="false">Geography</button>
                        <button type="button" class="chip" data-value="sport" role="radio" aria-checked="false">Sport</button>
                        <button type="button" class="chip" data-value="music and film" role="radio" aria-checked="false">Music &amp; film</button>
                        <button type="button" class="chip" data-value="technology" role="radio" aria-checked="false">Technology</button>
                        <button type="button" class="chip" data-value="literature" role="radio" aria-checked="false">Literature</button>
                    </div>
                </div>

                <button class="btn btn-primary" id="btn-start" onclick="startQuiz()">Start quiz</button>
            </section>

            <!-- Quiz screen -->
            <section class="panel screen" id="screen-quiz" hidden>
                <div class="readout">
                    <span>Question <b id="q-num">1</b>/<b id="q-total">5</b></span>
                    <div class="ticks" id="ticks" aria-hidden="true"></div>
                    <span>Score <b id="score">0</b></span>
                </div>

                <p class="question" id="question"></p>

                <!-- Equalizer -->
                <div class="signal">
                    <canvas id="scope" aria-hidden="true"></canvas>
                </div>

                <!-- Transcript - what STT heard -->
                <div class="transcript" id="transcript-box">
                    <span class="transcript-label">Heard</span>
                    <span class="transcript-text empty" id="transcript">waiting for your answer</span>
                </div>

                <div class="readout" style="justify-content:center;margin-bottom:1rem">
                    <span class="state-line">
                        <span class="state-dot" id="state-dot"></span>
                        <span id="state-label">ready</span>
                    </span>
                </div>

                <!-- End-of-quiz summary and error messages -->
                <p class="status" id="status"></p>

                <div class="btn-row">
                    <button class="btn btn-mic" id="btn-mic" onclick="pushToTalk()">Speak</button>
                    <button class="btn btn-ghost" onclick="stopQuiz()">End quiz</button>
                </div>
            </section>

            <!-- Debug panel -->
            <section class="panel debug">
                <div class="debug-head" role="button" tabindex="0"
                     onclick="toggleDebug()" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();toggleDebug()}">
                    <span>Model config</span>
                    <span id="debug-caret">hide</span>
                </div>

                <div class="debug-body" id="debug-body">

                    <label class="vad-toggle">
                        <input type="checkbox" id="cfg-vad" onchange="updateVadEnabled()" />
                        <span>Auto-stop on silence (VAD)</span>
                    </label>

                    <div class="model-grid">
                        <div>
                            <label for="sel-stt">STT</label>
                            <select id="sel-stt" onchange="updateConfig()">
                                <option value="whisper-large-v3">Whisper Large V3 Turbo · OR</option>
                                <option value="gpt4o-transcribe">GPT-4o Mini Transcribe · OR</option>
                                <option value="nova-3">Deepgram Nova-3 · OR</option>
                                <option value="voxtral-stt">Voxtral Transcribe · OR</option>
                            </select>
                        </div>
                        <div>
                            <label for="sel-llm">LLM</label>
                            <select id="sel-llm" onchange="updateConfig()">
                                <option value="qwen-openrouter">Qwen 3.6 27B · OR</option>
                                <option value="mistral-openrouter">Mistral Medium 3.5 · OR</option>
                                <option value="gpt-openrouter">GPT-5.4 Mini · OR</option>
                                <option value="gemini-openrouter">Gemini 3.7 Flash · OR</option>
                                <option value="nemotron-openrouter">NVIDIA Nemotron 3.5 Lightning · OR</option>
                            </select>
                        </div>
                        <div>
                            <label for="sel-tts">TTS</label>
                            <select id="sel-tts" onchange="updateConfig()">
                                <!-- <option value="orpheus">Orpheus · Groq</option> -->
                                <option value="kokoro">Kokoro 82M · OR</option>
                                <!-- <option value="gemini-tts">Gemini 3.1 Flash · OR</option> -->
                                <option value="qwen-tts">Qwen Audio 3.0 · OR</option>
                                <option value="deepgram-aura">Deepgram Aura-2 · OR</option>
                                <option value="minimax-speech">MiniMax: Speech 2.8 · OR</option>
                            </select>
                        </div>
                    </div>

                    <div class="log" id="log"></div>

                    <div class="btn-row" style="justify-content:flex-start">
                        <button class="btn btn-small" onclick="exportLog()">Export log</button>
                        <button class="btn btn-small" onclick="clearLog()">Clear log</button>
                    </div>

                </div><!-- /debug-body -->
            </section>

        </div><!-- /app -->

        <script src="/static/script.js"></script>
    </body>
</html>
